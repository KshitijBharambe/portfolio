<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="#050508"/>

  <!-- Subtle inner border -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="13" fill="none" stroke="#10b981" stroke-width="1" opacity="0.35"/>

  <!-- Top-left corner bracket (emerald) -->
  <path d="M9,22 L9,9 L22,9" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="square" filter="url(#glow)"/>

  <!-- Bottom-right corner bracket (amber) -->
  <path d="M78,91 L91,91 L91,78" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="square" filter="url(#glow-amber)"/>

  <!-- KB text -->
  <text
    x="50"
    y="55"
    dominant-baseline="middle"
    text-anchor="middle"
    font-size="37"
    font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, monospace"
    fill="#10b981"
    font-weight="700"
    letter-spacing="-1"
    filter="url(#glow)"
  >KB</text>
</svg>
